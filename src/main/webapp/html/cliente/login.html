<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Login - Bluewave</title>

<link rel="stylesheet" href="../../css/bluewave.css">

</head>

<body class="login-page">

	<div class="login-card">

		<div class="logo">BLUEWAVE</div>

		<h1>Bienvenido a Bluewave</h1>

		<p class="login-subtitle">Inicia sesión para continuar</p>

		<form action="/DemoWeb/Cliente" method="post">

			<input type="hidden" name="action" value="login"> <label
				for="email"> E-mail </label> <input type="email" id="email"
				name="email" placeholder="ejemplo@email.com" required> <label
				for="password"> Contraseña </label> <input type="password"
				id="password" name="password" required> <input type="submit"
				value="Entrar" class="btn">

		</form>

	</div>

</body>

</html>
